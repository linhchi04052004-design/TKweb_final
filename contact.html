<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ & Góp Ý | Sushi Fuji</title>
    <link rel="stylesheet" href="./css/contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>


    <div class="main-wrapper">
        <div class="container">
           
            <div class="left-side">
                <header class="logo-section">
                    <div class="brand">
                        <span class="material-icons logo-icon">restaurant</span>
                        <div>
                            <h1>SUSHI FUJI</h1>
                            <p>Tinh hoa ẩm thực Nhật Bản</p>
                        </div>
                    </div>
                </header>


                <div class="contact-details">
                    <h3>THÔNG TIN LIÊN HỆ</h3>
                    <div class="detail-item">
                        <span class="material-icons">location_on</span>
                        <p> Cơ sở 1:12-18 Nguyễn Chí Thanh, Ba Đình, Hà Nội <br>
                        Cơ sở 2: Viet Tower, Thái Hà, Hà Nội</p>
                    </div>
                    <div class="detail-item">
                        <span class="material-icons">phone</span>
                        <p>0.XXXX.XXXX</p>
                    </div>
                    <div class="detail-item">
                        <span class="material-icons">email</span>
                        <p>contact@sushifuji.vn</p>
                    </div>
                    <div class="detail-item">
                        <span class="material-icons">schedule</span>
                        <p>Mở cửa: 8:00 - 22:00 </p>
                    </div>
                </div>


                <div class="map-area">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.485124067425!2d106.691238!3d10.77413!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752f3922482351%3A0x6e8a0112f6797b10!2zQsOqbiBUaMOgbmgsIFF14bqtbiAxLCBUaMOgbmggcGjhu5EgSOG7kyBDaMOIE1pbmgsIFZp4buHdCBOYW0!5e0!3m2!1svi!2s!4v1711234567890!5m2!1svi!2s"
                        width="100%" height="220" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>


            <div class="right-side">
                <div class="form-card"> <div class=""></div>
                    <h2>LIÊN HỆ CHO CHÚNG TÔI </h2>
                    <form id="feedbackForm">
                        <div class="field">
                            <label>Họ và tên</label>
                            <input type="text" placeholder="Nhập tên của bạn..." required>
                        </div>
                        <div class="input-row">
                            <div class="field">
                                <label>Số điện thoại</label>
                                <input type="tel" placeholder="SĐT liên lạc..." required>
                            </div>
                            <div class="field">
                                <label>Chủ đề</label>
                                <select>
                                    <option>Góp ý dịch vụ</option>
                                    <option>Khác</option>
                                </select>
                            </div>
                        </div>
                        <div class="field">
                            <label>Lời nhắn của bạn</label>
                            <textarea rows="6" placeholder="Chúng tôi luôn lắng nghe ý kiến của bạn..."></textarea>
                        </div>
                        <button type="submit" class="btn-submit">GỬI GÓP Ý NGAY</button>
                    </form>
                </div>
            </div>


        </div>
    </div>


    <script src="./js/contact.js"></script>
</body>
</html>
