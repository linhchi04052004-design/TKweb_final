<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt hàng thành công</title>

    <!-- GIỮ CSS LOGIN -->
    <link rel="stylesheet" href="css/login.css">

    <!-- CSS RIÊNG -->
    <style>
        .success-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 38px 32px;
            width: 390px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
        }

        .success-container h2 {
            font-size: 24px;
            white-space: nowrap; /* 🔥 không xuống dòng */
            margin-bottom: 16px;
            font-weight: 700;
        }

        .success-container h2 span {
            color: #d4af37;
        }

        .success-container p {
            font-size: 15px;
            color: #555;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .success-container button {
            width: 100%;
            padding: 13px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #d4af37, #f1d889);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 14px;
            transition: 0.3s;
        }

        .success-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212,175,55,0.4);
        }

        /* ===== POPUP ĐƠN HÀNG ===== */
        .order-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .order-box {
            background: #fff;
            width: 520px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 18px;
            padding: 26px;
        }

        .order-box h3 {
            margin-bottom: 18px;
            color: #d4af37;
            text-align: center;
        }

        .order-item {
            display: flex;
            gap: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }

        .order-item img {
            width: 62px;
            height: 62px;
            object-fit: cover;
            border-radius: 10px;
        }

        .order-summary {
            margin-top: 18px;
            font-weight: 600;
            text-align: right;
        }

        .close-modal {
            margin-top: 18px;
            background: #eee;
            color: #333;
        }
    </style>
</head>

<body>

<div id="sakura-container"></div>

<div class="login-container success-container">
    <h2><span>ĐẶT HÀNG THÀNH CÔNG</span></h2>

    <p>
        Cảm ơn bạn đã đặt hàng tại <strong>Sushi Fuji</strong> 🍣<br>
        Đơn hàng của bạn đang được xử lý.
    </p>

    <button id="btn-view-order">XEM ĐƠN HÀNG CỦA TÔI</button>

    <a href="menu.html" style="text-decoration:none">
        <button>TIẾP TỤC MUA SẮM</button>
    </a>
</div>

<!-- POPUP ĐƠN HÀNG -->
<div class="order-modal" id="orderModal">
    <div class="order-box">
        <h3>CHI TIẾT ĐƠN HÀNG</h3>

        <div id="order-items"></div>

        <div class="order-summary">
            <p>Tổng sản phẩm: <span id="sum-qty"></span></p>
            <p>Thành tiền: <span id="sum-price"></span></p>
        </div>

        <button class="close-modal">ĐÓNG</button>
    </div>
</div>

<script>
    const order = JSON.parse(localStorage.getItem("orderLast"));
    const modal = document.getElementById("orderModal");
    const itemsBox = document.getElementById("order-items");

    document.getElementById("btn-view-order").onclick = () => {
        if (!order) {
            alert("Không tìm thấy đơn hàng");
            return;
        }

        itemsBox.innerHTML = "";
        let totalQty = 0;
        let totalPrice = 0;

        order.items.forEach(item => {
            const unitPrice =
                parseInt(String(item.price).replace(/[^\d]/g, "")) || 0;

            const itemTotal = unitPrice * item.quantity;
            totalQty += item.quantity;
            totalPrice += itemTotal;

            itemsBox.innerHTML += `
                <div class="order-item">
                    <img src="${item.img}" alt="${item.title}">
                    <div>
                        <strong>${item.title}</strong>
                        <p>Số lượng: ${item.quantity}</p>
                        <p>Thành tiền: ${itemTotal.toLocaleString("vi-VN")} VND</p>
                    </div>
                </div>
            `;
        });

        document.getElementById("sum-qty").innerText = totalQty;
        document.getElementById("sum-price").innerText =
            totalPrice.toLocaleString("vi-VN") + " VND";

        modal.style.display = "flex";
    };

    modal.querySelector(".close-modal").onclick = () => {
        modal.style.display = "none";
    };

    modal.onclick = e => {
        if (e.target === modal) modal.style.display = "none";
    };
</script>

</body>
</html>
