<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thông tin đặt bàn | Sushi Fuji</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          colors: { 
            fujiGold: '#f4b916', // Màu vàng giống nút Về trang chủ
            statusGreen: '#e3f5e6', // Nền xanh nhạt status
            textGreen: '#2e7d32'    // Chữ xanh status
          }, 
          fontFamily: { inter: ['Inter', 'sans-serif'] } 
        } 
      }
    }
  </script>
</head>
<body class="bg-gray-100 font-inter min-h-screen py-6 px-4 flex justify-center">

  <div class="w-full max-w-[500px] bg-white shadow-xl rounded-lg overflow-hidden relative">
    
    <div class="h-48 w-full relative">
      <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?q=80&w=800&auto=format&fit=crop" 
           alt="Banner" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-black/10"></div>
    </div>

    <div class="p-6 relative">
      
      <div class="flex justify-between items-center mb-6 border-b border-gray-50 pb-4">
        <span class="px-3 py-1 bg-statusGreen text-textGreen rounded-full text-xs font-bold font-inter">
          Đã duyệt
        </span>
        <button onclick="openCancelModal()" class="text-red-400 text-xs font-medium hover:underline">
            Hủy đặt bàn
        </button>
      </div>

      <div class="mb-8">
        <h2 id="resName" class="text-lg font-bold text-black mb-2">Sushi Fuji Nguyễn Chí Thanh</h2>
        
        <div class="flex items-center gap-2 text-blue-400 text-sm font-medium ml-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
          <span>02473007675</span>
        </div>
      </div>

      <div id="infoSection" class="space-y-3 text-sm text-gray-800 transition-all duration-300">
        
        <div class="flex justify-between items-start">
          <span class="text-gray-500">Mã đặt bàn</span>
          <span id="detailCode" class="font-bold text-black">...</span>
        </div>

        <div class="flex justify-between items-start">
          <span class="text-gray-500">Thời gian đặt</span>
          <span id="detailCreated" class="font-bold text-black text-right">...</span>
        </div>

        <div class="flex justify-between items-start">
          <span class="text-gray-500">Thời gian mong muốn dùng bữa</span>
          <span id="detailMealTime" class="font-bold text-black text-right">...</span>
        </div>

        <div class="flex justify-between items-start">
          <span class="text-gray-500">Số lượng người</span>
          <span id="detailGuests" class="font-bold text-black">...</span>
        </div>

        <div class="flex justify-between items-start">
          <span class="text-gray-500">Họ và tên</span>
          <span id="detailName" class="font-bold text-black uppercase">...</span>
        </div>

        <div class="flex justify-between items-start">
          <span class="text-gray-500">Số điện thoại</span>
          <span id="detailPhone" class="font-bold text-black">...</span>
        </div>


        <div class="flex justify-between items-start">
          <span class="text-gray-500">Ghi chú</span>
          <span id="detailNote" class="font-bold text-black italic text-right max-w-[50%]">...</span>
        </div>

      </div>

      <div class="text-center mt-6 mb-8">
        <button onclick="toggleInfo()" class="text-blue-400 text-sm font-medium hover:underline">
          Ẩn thông tin
        </button>
      </div>

      <a href="booking.html" class="block w-full bg-fujiGold text-black font-bold text-center py-4 rounded-lg shadow-md hover:bg-yellow-500 transition">
        Về trang chủ
      </a>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Lấy dữ liệu từ bộ nhớ
      const storedData = localStorage.getItem('fujiBookingData');

      if (!storedData) {
        alert("Bạn chưa có đơn đặt bàn nào!");
        window.location.href = 'booking.html';
        return;
      }

      const data = JSON.parse(storedData);

      // --- XỬ LÝ NGÀY THÁNG (SỬA LỖI TẠI ĐÂY) ---
      // Lấy ngày hôm nay theo định dạng yyyy-mm-dd để so sánh
      const d = new Date();
      const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      
      let dateDisplay = "";
      
      if (data.mealDate === todayStr) {
          // Nếu trùng ngày hôm nay
          dateDisplay = "Hôm nay";
      } else {
          // Nếu là ngày khác, đổi format từ 2025-12-20 thành 20/12/2025 cho đẹp
          const parts = data.mealDate.split('-'); 
          dateDisplay = `Ngày ${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      // ---------------------------------------------

      // 2. Điền dữ liệu vào HTML
      document.getElementById('detailCode').innerText = '#' + data.id;
      document.getElementById('detailCreated').innerText = 'Hôm nay - ' + data.createdTime; // Thời gian tạo đơn thì luôn là hôm nay
      
      // Dòng này đã được sửa để hiện đúng ngày bạn chọn:
      document.getElementById('detailMealTime').innerText = `${dateDisplay} - ${data.mealTime}`; 
      
      document.getElementById('detailGuests').innerText = data.guests + ' người';
      document.getElementById('detailName').innerText = data.name;
      document.getElementById('detailPhone').innerText = data.phone;
      document.getElementById('detailNote').innerText = data.note || 'Không có';
      document.getElementById('resName').innerText = data.restaurantName;
    });

    function toggleInfo() {
      const section = document.getElementById('infoSection');
      const btn = document.querySelector('button[onclick="toggleInfo()"]');
      
      if (section.style.display === 'none') {
        section.style.display = 'block';
        btn.innerText = 'Ẩn thông tin';
      } else {
        section.style.display = 'none';
        btn.innerText = 'Hiện thông tin';
      }
    }
    // --- LOGIC HỦY ĐẶT BÀN ---

// 1. Mở Modal
function openCancelModal() {
  document.getElementById('cancelModal').classList.remove('hidden');
}

// 2. Đóng Modal (Nút Quay lại)
function closeCancelModal() {
  document.getElementById('cancelModal').classList.add('hidden');
}

// 3. Xác nhận Hủy (Nút Đồng ý)
// --- LOGIC HỦY ĐẶT BÀN ---

function openCancelModal() {
  document.getElementById('cancelModal').classList.remove('hidden');
}

function closeCancelModal() {
  document.getElementById('cancelModal').classList.add('hidden');
}

// Hàm xử lý khi nhấn nút "Đồng ý" ở bảng chọn lý do
function confirmCancel() {
  // 1. Kiểm tra lý do
  const reasons = document.getElementsByName('cancelReason');
  let isSelected = false;
  for (const r of reasons) {
    if (r.checked) isSelected = true;
  }

  if (!isSelected) {
    alert("Vui lòng chọn lý do hủy đặt bàn!");
    return;
  }

  // 2. Xóa dữ liệu đặt bàn khỏi bộ nhớ ngay lập tức
  localStorage.removeItem('fujiBookingData');

  // 3. Đóng Modal chọn lý do & Mở Modal thông báo thành công
  document.getElementById('cancelModal').classList.add('hidden'); // Ẩn cái cũ
  document.getElementById('cancelSuccessModal').classList.remove('hidden'); // Hiện cái mới
}

// Hàm xử lý khi nhấn nút "Về trang chủ" (Kết thúc quy trình)
function finishCancel() {
  window.location.href = 'booking.html';
}
</script>
<div id="cancelModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity">
  <div class="bg-white w-full max-w-[400px] rounded-2xl p-6 shadow-2xl transform scale-100 transition-all">
    <h3 class="text-lg font-bold text-center mb-6 text-gray-900">Lý do huỷ đặt bàn</h3>
    
    <div class="space-y-4 mb-8 px-2">
      <label class="flex items-center space-x-3 cursor-pointer group p-2 hover:bg-gray-50 rounded-lg transition">
        <input type="radio" name="cancelReason" value="change_restaurant" class="w-5 h-5 text-fujiGold border-gray-300 focus:ring-fujiGold">
        <span class="text-gray-700 font-medium group-hover:text-black">Thay đổi nhà hàng</span>
      </label>
      
      <label class="flex items-center space-x-3 cursor-pointer group p-2 hover:bg-gray-50 rounded-lg transition">
        <input type="radio" name="cancelReason" value="change_date" class="w-5 h-5 text-fujiGold border-gray-300 focus:ring-fujiGold">
        <span class="text-gray-700 font-medium group-hover:text-black">Thay đổi ngày đến</span>
      </label>
      
      <label class="flex items-center space-x-3 cursor-pointer group p-2 hover:bg-gray-50 rounded-lg transition">
        <input type="radio" name="cancelReason" value="other" class="w-5 h-5 text-fujiGold border-gray-300 focus:ring-fujiGold">
        <span class="text-gray-700 font-medium group-hover:text-black">Khác</span>
      </label>
    </div>

    <div class="flex gap-3">
      <button onclick="closeCancelModal()" class="flex-1 py-3 border border-gray-300 rounded-xl font-bold text-gray-600 hover:bg-gray-100 transition">
        Quay lại
      </button>
      <button onclick="confirmCancel()" class="flex-1 py-3 bg-fujiGold text-black rounded-xl font-bold hover:bg-yellow-500 transition shadow-md">
        Đồng ý
      </button>
    </div>
  </div>
</div>

<div id="cancelSuccessModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm">
  <div class="bg-white w-full max-w-sm rounded-2xl p-8 shadow-2xl text-center transform scale-100 transition-all">
    
    <div class="mx-auto w-20 h-20 bg-green-500 rounded-full flex items-center justify-center shadow-lg shadow-green-200 mb-6">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h3 class="text-xl font-bold text-gray-900 mb-2">Hủy đặt bàn thành công</h3>
    <p class="text-gray-500 text-sm mb-8">Hãy ghé thăm nhà hàng vào lần tới nhé</p>

    <button onclick="finishCancel()" class="w-full py-3 bg-fujiGold text-black rounded-xl font-bold hover:bg-yellow-500 transition shadow-md">
      Về trang chủ
    </button>
  </div>
</div>
</body>
</html>
