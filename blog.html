<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi World News - Official</title>
    <style>
        /* --- 1. CSS TỔNG THỂ --- */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f4f4f4; 
            padding: 0; 
            margin: 0; 
            overflow-x: hidden; 
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }

        /* --- 2. BANNER HEADER (CHÈN ẢNH THỰC TẾ) --- */
        header { 
            text-align: center; 
            padding: 40px 20px; 
            /* Nền sóng biển nhạt phía sau */
            background: #e0faff url('https://www.transparenttextures.com/patterns/waves.png'); 
            margin-bottom: 50px; 
            border-bottom: 8px solid #0091ea;
            position: relative;
            height: 400px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            /* CÂU LỆNH QUAN TRỌNG ĐỂ TRÀN KHUNG */
    background-image: url('./assets/images/bannerblog2.png'); /* Thay bằng ảnh bạn muốn làm nền */
    background-size: cover;    /* Phủ kín toàn bộ khung xanh */
    background-position: center; /* Căn ảnh vào chính giữa */
    background-repeat: no-repeat;
    
    border-bottom: 8px solid #0091ea;
        }

        /* Logo Sushi World ở trên cùng */
        .main-logo {
            max-width: 240px;
            z-index: 10;
            margin-bottom: 10px;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.1));
        }

        /* Chữ NEWS cách điệu */
        header h1 { 
            font-size: 90px; 
            font-family: Lora;
            color: #1a237e; 
            letter-spacing: 20px; 
            
            margin-top: -50px;
            font-weight: 900;
            text-shadow: 4px 4px 0px #fff, 8px 8px 25px rgba(0, 145, 234, 0.3);
            z-index: 5;
            position: relative;

           ; /* Ảnh sẽ tràn vào khung chữ */
    background-size: cover;
    background-position: center;
    -webkit-background-clip: text; /* Cắt ảnh theo khung chữ */
    background-clip: text;
    color: transparent; /* Làm màu chữ trong suốt để hiện ảnh bên dưới */
    
    filter: drop-shadow(5px 5px 15px rgba(0,0,0,0.3));
        }

        /* Các đĩa Sushi trang trí (Ảnh từ folder images) */
        .decor-plate {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 6px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            object-fit: cover;
            z-index: 2;
            transition: all 0.4s ease;
            background: #fff;
        }

        /* Tọa độ các đĩa xung quanh chữ NEWS */
        .p1 { top: 10%; left: 8%; transform: rotate(-15deg); }
        .p2 { bottom: 8%; left: 15%; transform: rotate(10deg); width: 160px; height: 160px; }
        .p3 { bottom: 12%; right: 18%; transform: rotate(-8deg); width: 120px; height: 120px; }
        .p4 { top: 15%; right: 6%; transform: rotate(12deg); width: 150px; height: 150px; }

        .decor-plate:hover {
            transform: scale(1.1) rotate(0deg);
            z-index: 15;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border-color: #0091ea;
        }

        /* --- 3. LƯỚI BÀI VIẾT BLOG --- */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 30px;
        }

        .blog-card {
            background: #fff;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-bottom: 6px solid #bc1515; /* Đường kẻ đỏ Sushi World */
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .blog-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .blog-card img { 
            width: 100%; 
            height: 250px; 
            object-fit: cover; 
            display: block;
        }

        .blog-content { padding: 25px; flex-grow: 1; }
        
        .blog-content h3 { 
            font-size: 1.15rem; 
            color: #1a237e; 
            margin: 0 0 15px 0; 
            text-transform: uppercase; 
            line-height: 1.4;
            font-weight: bold;
        }

        .blog-content p { 
            font-size: 0.95rem; 
            color: #555; 
            line-height: 1.6; 
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive di động */
        @media (max-width: 768px) {
            header h1 { font-size: 60px; letter-spacing: 5px; }
            header { height: 280px; }
            .decor-plate { display: none; } /* Ẩn đĩa sushi trên mobile cho gọn */
            .blog-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <img src=""
        " alt="Logo" class="main-logo" onerror="this.src='https://via.placeholder.com/250x100?text=Logo+Error'">
        
        <h1>NEWS</h1>

        <img src="./assets/images/Blog 1.png" class="decor-plate p1" alt="Sashimi">
        <img src="./assets/images/Blog 2.png" class="decor-plate p2" alt="Sushi">
        <img src="./assets/images/Blog 3.png" class="decor-plate p3" alt="Nigiri">
        <img src="./assets/images/Blog 4.png" class="decor-plate p4" alt="Maki">
    </header>

    <div class="container">
        <div id="blog-container" class="blog-grid">
            <p style="text-align: center;">Đang tải tin tức...</p>
        </div>
    </div>

    <script>
        async function fetchBlogs() {
            try {
                // Fetch từ thư mục data/blog.json
                const response = await fetch('./data/blog.json'); 
                
                if (!response.ok) {
                    throw new Error('Không tìm thấy file blog.json. Hãy kiểm tra lại thư mục data.');
                }
                
                const data = await response.json();
                const container = document.getElementById('blog-container');
                
                // Render HTML
                container.innerHTML = data.map(blog => `
                    <article class="blog-card">
                        <img src="${blog.image}" alt="${blog.title}" 
                             onerror="this.src='https://via.placeholder.com/400x250?text=Loi+Anh'">
                        <div class="blog-content">
                            <h3>${blog.title}</h3>
                            <p>${blog.description}</p>
                        </div>
                    </article>
                `).join('');
                
            } catch (error) {
                console.error("Lỗi Fetch:", error);
                document.getElementById('blog-container').innerHTML = 
                    `<div style="text-align:center; color:red; grid-column: 1/-1; padding: 50px;">
                        <p><b>Lỗi:</b> ${error.message}</p>
                        <p>Hãy đảm bảo bạn đang chạy bằng <b>Live Server</b>.</p>
                    </div>`;
            }
        }

        // Chạy khi trang web tải xong
        document.addEventListener('DOMContentLoaded', fetchBlogs);
    </script>
</body>
</html>
