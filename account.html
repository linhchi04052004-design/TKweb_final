<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sushi Fuji – Hồ sơ khách hàng</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #faf7f2;
      color: #2c2c2c;
    }

    /* ===== HEADER ===== */
    header {
      background: #8b1e1e;
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      color: #fff;
      font-weight: 700;
    }


    
    nav a {
      margin: 0 14px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .user-actions button {
      border-radius: 20px;
      padding: 8px 16px;
      border: none;
      cursor: pointer;
      margin-left: 8px;
    }
    .btn-light { background: #fff; color: #8b1e1e; }
    .btn-outline { background: transparent; color: #fff; border: 1px solid #fff; }

    /* ===== HERO ===== */
    .hero {
      height: 400px;
      background: url('./assets/images/bannerblog2.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      padding-left: 60px;
    }
    .hero-card {
      background: rgba(240, 236, 236, 0.92);
      padding: 28px 32px;
      border-radius: 10px;
      max-width: 420px;
      align-items: center;

    }

    .hero-card h1 {
      font-family: 'Playfair Display', serif;
      margin: 0 0 12px;
      color: #8b1e1e;
    }

    /* ===== LAYOUT ===== */
    .container {
      padding: 40px 60px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 40px;
      align-items: stretch;
    }

    .card {
      background: #8b1e1e;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h2 {
      font-family: 'Playfair Display', serif;
      color: #8b1e1e;
      margin-top: 0;
    }

    /* ===== PROFILE ===== */
    .profile {
      text-align: center;
    }
    .avatar {
      width: 150;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      
    }

    .tag {
      display: inline-block;
      margin: 6px 4px;
      padding: 6px 12px;
      font-size: 12px;
      background: #f3e6e6;
      color: #8b1e1e;
      border-radius: 14px;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 30px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 24px;
    }
    .tabs span {
      padding-bottom: 10px;
      cursor: pointer;
      font-weight: 500;
    }
    .tabs .active {
      color: #8b1e1e;
      border-bottom: 2px solid #8b1e1e;
    }
/* ===== FORM ===== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      
    }

    .form-container {
    display: flex;
    flex-direction: column;
    min-height: 550px; /* Ép khung cao lên để cân đối với bên trái */
    padding: 40px !important; /* Tăng padding bên trong */
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px 30px; /* Tăng khoảng cách giữa các ô */
    flex-grow: 1; /* Đẩy nội dung chiếm không gian giữa */
}


/* Ô mật khẩu dàn hàng ngang cho đầy đặn */
.full-width {
    grid-column: span 2;
}

.input-box label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
}

/* Chỉnh lại nút bấm */
.form-actions {
    margin-top: 30px;
    display: flex;
    justify-content: flex-start;
}

#btnSaveProfile {
    background: white;
    color: #8b1e1e;
    border: none;
    padding: 12px 40px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

#btnSaveProfile:hover {
    transform: scale(1.05);
    background: #f8f8f8;
}




    label { font-size: 13px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    textarea { grid-column: span 2; resize: none; }

    /* ===== BARCODE ===== */
    .barcode {
      margin-top: 24px;
      text-align: center;
    }
    .barcode img {
      max-width: 100%;
    }

    footer {
      background: #8b1e1e;
      color: #fff;
      text-align: center;
      padding: 16px;
      margin-top: 60px;
      font-size: 13px;
    }
    /* 1. Font & General Smoothness */
body {
    -webkit-font-smoothing: antialiased !important;;
    letter-spacing: -0.01em !important;;
}

/* 2. Hiệu ứng Card sang trọng */
section {
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) !important;;
    border: 1px solid rgba(139, 30, 30, 0.05) /* Viền đỏ siêu mảnh */ !important;
}

section:hover {
    transform: translateY(-4px) !important;;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05) !important;;
    border-color: rgba(139, 30, 30, 0.2) !important;;
}

/* 3. Tùy chỉnh các ô Input */
input, textarea, #timeTrigger {
    transition: all 0.3s ease !important;;
    border: 1.5px solid #f3f4f6 !important; /* Mặc định viền rất nhạt */
}

input:focus, textarea:focus {
    background-color: #fff !important;
    border-color: #8b1e1e !important;
    box-shadow: 0 0 0 4px rgba(139, 30, 30, 0.05)!important;;
}

/* 4. Nút bấm xác nhận kiểu "Premium" */
button[onclick="handleConfirm()"] {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #8b1e1e 0%, #b32626 100%);
    transition: all 0.3s ease;
}

button[onclick="handleConfirm()"]:hover {
    transform: scale(1.02);
    filter: brightness(1.1);
    box-shadow: 0 15px 30px rgba(139, 30, 30, 0.3);
}

button[onclick="handleConfirm()"]:active {
    transform: scale(0.98);
}

/* 5. Custom lại bộ đếm khách (Guest Counter) */
#guestCount {
    text-shadow: 2px 2px 0px rgba(139, 30, 30, 0.05) !important;;
}

button[onclick^="changeGuest"] {
    background-color: #fff;
    font-weight: 300;
}

button[onclick^="changeGuest"]:hover {
    background-color: #8b1e1e;
    color: #fff !important;
}

/* 6. Hiệu ứng cho Time Picker Dropdown */
#timeOptions {
    backdrop-filter: blur(8px) !important;;
    background-color: rgba(255, 255, 255, 0.95) !important;;
    border: 1px solid rgba(139, 30, 30, 0.1) !important;;
}

#timeOptions div:hover {
    background-color: #8b1e1e!important;
    color: white !important;
}

 /*7. Họa tiết chìm kiểu Nhật (Omi-pattern) - Thêm vào background chính 
body::before {
    content: "" !important;
    position: fixed !important;
    top: 0; left: 0; width: 100%; height: 100%;
z-index: -1 !important;
    background-image: radial-gradient(#8b1e1e 0.5px, transparent 0.5px) !important;
    background-size: 30px 30px !important;
    opacity: 0.03 !important; /* Cực kỳ mờ để tạo texture */

/* Chuyển tất cả chữ trong thẻ Card (khung đỏ) thành màu trắng */
.card {
    color: white !important;
}

/* Chỉnh màu cho các nhãn (label) của ô nhập liệu */
.card label {
    color: rgba(255, 255, 255, 0.9) !important; /* Trắng hơi mờ một chút cho sang */
}

/* Chỉnh màu cho các tiêu đề h3, p bên trong khung */
.card h3, 
.card p, 
.card b,
.card span {
    color: white !important;
}

/* Tùy chỉnh các Tab (Thông tin, Đơn hàng...) */
.tabs span {
    color: rgba(255, 255, 255, 0.7) !important; /* Tab không hoạt động màu trắng mờ */
}

.tabs span.active {
    color: white !important;
    border-bottom-color: white !important; /* Gạch chân tab active màu trắng */
}

/* Đảm bảo chữ bên trong ô Input vẫn màu đen để dễ đọc trên nền trắng */
input, textarea {
    color: #2c2c2c !important;
}

/* Chỉnh lại đường kẻ ngang (hr) cho hợp với nền đỏ */
hr {
    border: 0;
    border-top: 1px solid rgba(255, 255, 255, 0.2) !important;
}


/* Tablet (iPad) */
@media (max-width: 1024px) {
    .container {
        grid-template-columns: 1fr; /* Chuyển về 1 cột dọc */
        padding: 30px;
    }
    
    .card.profile {
        min-height: auto;
    }
}

/* Điện thoại di động */
@media (max-width: 768px) {
    .hero {
        padding-left: 20px;
        height: 300px;
    }
    
    .hero-card {
        max-width: 90%;
    }

    .form-grid {
        grid-template-columns: 1fr; /* Form xếp thành 1 hàng dọc */
        gap: 20px;
    }
    
    .avatar {
        width: 150px; /* Thu nhỏ avatar một chút trên mobile */
        height: 150px;
    }

    .container {
        padding: 20px;
    }

    .card.form-container {
        padding: 25px !important;
    }
}

  </style>
</head>
<body>



<section class="hero">
  <div class="hero-card">
    <h1>Hồ sơ khách hàng</h1>
    <p>Quản lý thông tin cá nhân và trải nghiệm ẩm thực tại Sushi Fuji</p>
  </div>
</section>

<section class="container">

  <div class="card profile">

    <img src="assets/user.png" class="avatar" alt="Avatar" />

    <h3>Xin chào !!!</h3>
  

    <hr style="margin:20px 0">

    <p><b>Tên đăng nhập:</b> <span id="usernameText"></span></p>
    
    
  </div>

  <div class="card">
  <div class="tabs">
    <span class="active" id="tabProfile">Thông tin chi tiết</span>
    <span id="tabOrders">Đơn hàng</span>
  </div>

  <!-- Form thông tin -->
  <div id="profileTab">
    <div class="form-grid">
      <div>
        <label>Họ và tên</label>
        <input id="fullnameInput" />
      </div>
      <div>
        <label>Ngày sinh</label>
        <input type="date" />
      </div>
      <div>
        <label>Số điện thoại</label>
        <input id="phoneInput" />
      </div>
      <div>
        <label>Email</label>
        <input id="emailInput" />
      </div>
      <div>
        <label>Mật khẩu</label>
        <input type="password" id="passwordInput" />
      </div>
    </div>

    <button id="btnSaveProfile" style="margin-top:20px">
      Cập nhật hồ sơ
    </button>
  </div>

  <!-- Tab Đơn hàng -->
  <div id="ordersTabContent" style="display:none; margin-top:20px;">
    <h3>Đơn hàng của bạn</h3>
    <div id="ordersList"></div>
  </div>
</div>




</section>

<script src="js/account.js"></script>

</body>
</html>
