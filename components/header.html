<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sushi Fuji</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/SushiFuji.png">
    
    <style>
        /* CSS GỐC CỦA BẠN */
        body { margin: 0; padding: 0; font-family: "Judson", serif; }
        .header { background-color: #961e1e; padding: 0; position: relative; }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            max-width: 1400px;
            margin: 0 auto;
            height: 90px;
        }

        .header-logo img {
            height: 100px; 
            width: auto;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 25px;
            padding: 0 20px;
            height: 42px;
            width: 500px; 
            margin: 0 10px;
        }

        .search-box input { border: none; outline: none; width: 100%; font-size: 14px; }
        .account-cart { display: flex; gap: 15px; align-items: center; }

        .account, #cart {
            background-color: transparent;
            border: 1px solid white;
            border-radius: 20px;
            padding: 6px 18px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .account a { text-decoration: none; color: white; }
        .account:hover, #cart:hover { background-color: white; color: #961e1e; }
        .account:hover a, .account:hover i { color: #961e1e; }

        .menu-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 0;
            gap: 20px;
        }

        .menu-bar a {
            text-decoration: none;
            color: #D9D9D9;
            font-size: 16px;
            text-transform: uppercase;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .menu-bar a:hover, .menu-bar a.active {
            background-color: white;
            color: #8F0707;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* --- PHẦN MỚI: NÚT HAMBURGER (ẨN TRÊN PC) --- */
        .menu-toggle {
            display: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        /* --- RESPONSIVE CHO MOBILE & TABLET --- */
        @media (max-width: 1024px) {
            .header-container { height: auto; padding: 15px 20px; flex-wrap: wrap; }
            .search-box { width: 100%; order: 3; margin: 15px 0 0 0; }
            .menu-toggle { display: block; } /* Hiện nút 3 gạch */
            
            /* Biến menu thành menu dọc ẩn đi */
            .menu-bar {
                display: none; 
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #8F0707;
                z-index: 1000;
                padding: 0;
                box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            }

            .menu-bar.active { display: flex; } /* Hiện khi nhấn 3 gạch */

            .menu-bar a {
                width: 100%;
                text-align: center;
                padding: 15px 0;
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }
        }

        @media (max-width: 768px) {
            .header-logo img { height: 60px; }
            .account span, #cart span { display: none; } /* Ẩn chữ, giữ icon */
            .account, #cart { padding: 8px 12px; }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-container">
            <div class="menu-toggle" id="mobile-menu">
                <i class="fa-solid fa-bars"></i>
            </div>

            <div class="header-logo">
                <img src="../assets/logo2.png" alt="Logo"> 
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm...">
                <i class="fa-solid fa-magnifying-glass" id="searchIcon" style="cursor: pointer;"></i>
            </div>

            <div class="account-cart">
                <div class="account">
                    <i class="fa-regular fa-user"></i>
                    <div id="accountSection">
                        <a href="../login.html" id="login-link"><span>Đăng nhập</span></a>
                    </div>
                </div>
                <button id="cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Giỏ hàng</span>
                </button>
            </div>
        </div>

        <div class="menu-bar" id="menuBar">
            <a href="../homepage.html" class="active">TRANG CHỦ</a>
            <a href="../menu.html">THỰC ĐƠN</a>
            <a href="../restaurants.html">ĐẶT BÀN</a>
            <a href="../blog.html">TIN TỨC</a>
            <a href="../promotion.html">KHUYẾN MÃI</a>
            <a href="../about.html">VỀ CHÚNG TÔI</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Xử lý bật/tắt Menu Mobile
            const menuToggle = document.getElementById("mobile-menu");
            const menuBar = document.getElementById("menuBar");

            menuToggle.addEventListener("click", () => {
                menuBar.classList.toggle("active");
                // Đổi icon từ 3 gạch sang dấu X khi mở
                const icon = menuToggle.querySelector("i");
                icon.classList.toggle("fa-bars");
                icon.classList.toggle("fa-xmark");
            });

            // Xử lý Login/Logout (Giữ nguyên logic của bạn)
            const currentUser = localStorage.getItem("currentUser");
            const loginLink = document.getElementById("login-link");

            if (currentUser) {
                const user = JSON.parse(currentUser);
                loginLink.innerHTML = `<span>Xin chào, ${user.username}</span>`;
                loginLink.href = "#";
                
                // Thêm sự kiện đăng xuất nếu cần ở đây
            }
        });
    </script>
</body>
</html>
