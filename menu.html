<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Ảnh - Auto Flip</title>
    
    <style>
        /* --- CSS --- */
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #faf8f8; /* Nền đen để làm nổi bật ảnh */
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Chặn thanh cuộn */
        }
        #menu {
        position: absolute;  /* "Nhấc" chữ ra khỏi bố cục, cho phép nó bay lơ lửng */
        top: 30px;           /* Cách mép trên cùng màn hình 30px */
        left: 50%;           /* Đẩy sang 50% chiều rộng */
        transform: translateX(-50%); /* Kéo ngược lại 50% kích thước chữ để căn giữa tuyệt đối */
        z-index: 999;        /* Đảm bảo chữ luôn nằm TRÊN cuốn sách (không bị che) */

        /* Style trang trí */
        color: #d4af37;
        font-family: 'Playfair Display', serif;
        font-size: 6rem;
        letter-spacing: 15px;
        text-transform: uppercase;
        margin: 0;
        pointer-events: none; /* Để chuột bấm xuyên qua chữ được (nếu chữ che mất sách) */
    }
        .book-wrapper {
            /* Vùng chứa sách */
            display: flex;
            justify-content: center;
            align-items: center;
        
        }

        /* Thiết kế 1 trang giấy */
        .page {
            background-color: #fff; 
            overflow: hidden; /* Cắt phần ảnh thừa nếu có */
            /* Border mỏng bao quanh ảnh (tùy chọn) */
            border: 1px solid #333; 
        }

        /* Ảnh chiếm toàn bộ trang */
        .page img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Đảm bảo ảnh lấp đầy khung mà không bị méo */
            display: block;
        }
    </style>
</head>
<body>
    <h1 id="menu">MENU</h1>
    <div class="book-wrapper">
        <div id="book"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <script src="js/menu.js"></script>

</body>
</html>
