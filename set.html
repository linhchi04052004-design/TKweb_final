<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực đơn Sushi</title>
    <link rel="stylesheet" href="css/menu.css">
    <style>
        .back-nav {
            width: 95%;
            max-width: 1200px;
            margin: 20px 0;
            display: flex;
            align-items: center;
        }

        .back-btn {
            text-decoration: none;
            color: #555;
            font-weight: 700;
            display: flex;
            align-items: center;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #d4af37;
        }

        .back-btn span {
            font-size: 1.2rem;
            margin-right: 8px;
        }
    </style>
</head>

<body>

    <h1 id="menu">SET</h1>

    <div class="back-nav">
        <a href="menu.html" class="back-btn">
            <span>&#8592;</span> Quay lại trang chủ
        </a>
    </div>

    <div class="container-box">
        <h2 class="category-title" style="margin-left: 0;">Các món Sushi</h2>
        
        <div class="product-grid">

            <div class="product-item">

                <div class="product-img-wrapper"><img src="assets/Set/Cá ngừ giòn.jpg"></div>

                <h3 class="product-name">Cá ngừ giòn</h3>

                <p class="product-price">175.000đ</p>

                <button class="add-btn">+</button>

            </div>

            <div class="product-item">

                <div class="product-img-wrapper"><img src="assets/Set/Cá ngừ sống.jpg"></div>

                <h3 class="product-name">Cá ngừ sống</h3>

                <p class="product-price">170.000đ</p>

                <button class="add-btn">+</button>

            </div>

            <div class="product-item">

                <div class="product-img-wrapper"><img src="assets/Set/Gà giòn.png"></div>

                <h3 class="product-name">Gà giòn</h3>

                <p class="product-price">145.000đ</p>

                <button class="add-btn">+</button>

            </div>

            <div class="product-item">

                <div class="product-img-wrapper"><img src="assets/Set/Hero mixed box.jpg"></div>

                <h3 class="product-name">Hero mixed box</h3>

                <p class="product-price">205.000đ</p>

                <button class="add-btn">+</button>

            </div>

            <div class="product-item">

                <div class="product-img-wrapper"><img src="assets/Set/Sò điệp nướng.png"></div>

                <h3 class="product-name">Sò điệp nướngi</h3>

                <p class="product-price">195.000đ</p>

                <button class="add-btn">+</button>

            </div>

            <div class="product-item">

                <div class="product-img-wrapper"><img src="assets/Set/spicy-box.jpg"></div>

                <h3 class="product-name">Spicy box</h3>

                <p class="product-price">155.000đ</p>

                <button class="add-btn">+</button>

            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.add-btn');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Lấy tên sản phẩm từ thẻ h3 cùng cấp
                    const productItem = this.closest('.product-item');
                    const productName = productItem.querySelector('.product-name').innerText;
                  
                });
            });
        });
    </script>
<script src="js/menu.js"></script>
<script src="js/cart.js"></script>

</body>
</html>
