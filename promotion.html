<style>
header h1 {
    text-align: center;
    margin-top: 30px; /* Khoảng cách phía trên tiêu đề */
    margin-bottom: 5px; /* Khoảng cách với phần nội dung bên dưới */
}
/* Dàn trang dạng lưới */
.promotion-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 25px;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
}

/* Định dạng thẻ voucher */
.promo-card {
    display: flex;
    flex-direction: column;
    height: 100%; /* Đảm bảo các card trong cùng một hàng có chiều cao bằng nhau */
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.promo-card:hover {
    transform: translateY(-5px); /* Hiệu ứng bay lên khi di chuột */
}

.promo-image {
    position: relative;
    height: 200px;
}

.promo-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.promo-tag {
    position: absolute;
    top: 15px;
    left: 15px;
    background: #ff4757;
    color: white;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: bold;
}

.promo-content {
    padding: 20px;
    
}

.promo-content h3 {
    margin: 0 0 10px 0;
    color: #2f3542;
}

.btn-container {
    width: 100%;
    margin-top: auto; /* Đẩy nút xuống đáy nếu nội dung p ngắn dài khác nhau */
    padding-top: 15px;
}.btn-detail {
    display: block;           /* Biến thẻ a thành khối để nhận width 100% */
    width: 100%;              /* Phủ kín chiều ngang của promo-content */
    background-color: #4fcb87; /* Màu xanh lá chuẩn mẫu của bạn */
    color: white !important;  /* Đảm bảo chữ luôn trắng */
    text-align: center;       /* Căn giữa chữ */
    padding: 12px 0;          /* Khoảng cách trên dưới cho nút dày lên */
    border-radius: 5px;       /* Bo góc nhẹ */
    text-decoration: none;    /* Bỏ gạch chân mặc định của liên kết */
    font-weight: bold;
    font-size: 14px;
    transition: all 0.3s ease;
    box-sizing: border-box;   /* Quan trọng: Để padding không làm tràn khung */
}

.btn-detail:hover {
    background-color: #3eb473; /* Tối màu hơn một chút khi di chuột */
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

/* Đảm bảo nội dung card không bị dính sát mép */
.promo-content {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex-grow: 1; /* Giúp các card cao bằng nhau */
}

/* Định dạng thẻ voucher */
.promo-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;
}

.promo-card:hover {
    transform: translateY(-5px); /* Hiệu ứng bay lên khi di chuột */
}

.promo-image {
    position: relative;
    height: 200px;
}

.promo-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.promo-tag {
    position: absolute;
    top: 15px;
    left: 15px;
    background: #ff4757;
    color: white;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: bold;
}

.promo-content {
    padding: 20px;
}

.promo-content h3 {
    margin: 0 0 10px 0;
    color: #2f3542;
}


/* --- PHẦN CSS CHO TRANG CHI TIẾT --- */
.detail-body {
    background-color: #232a5e !important; /* Xanh đậm sang trọng */
}

.info-box {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    padding: 25px;
    color: white;
    border-left: 4px solid #f1b74a;
}

.btn-back-home {
    background: #f1b74a;
    color: #232a5e;
    padding: 10px 30px;
    border-radius: 25px;
    font-weight: bold;
    text-decoration: none;
}
</style>

</head>
<body>
    <!-- Nhúng header -->
    <div
        id="header"
        class="fixed top-0 left-0 w-full z-[9999] transition-all duration-300"
    ></div>
    <div
    id="header"
    class="fixed top-0 left-0 w-full z-[9999] transition-all duration-300"
  ></div>
    <header>
        <h1>Chương Trình Khuyến Mãi</h1>
    </header>

        <div id="promotion-container" class="promotion-grid"></div>
    </main>

<!-- Nhúng footer -->
<div id="footer"></div>
