<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <!-- KHUNG ĐĂNG KÝ -->
    <div class="register-container">
        <div class="register-box">
            <h1>REGISTER</h1>

            <div class="input-group">
                <label>Số điện thoại</label>
                <input type="text" id="phone">
            </div>

            <div class="input-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="username">
            </div>

            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" onkeyup="checkPassword()">
            </div>

            <div class="password-requirements">
                <h3>Yêu cầu mật khẩu:</h3>
                <ul>
                    <li id="length" class="invalid">Ít nhất 8 ký tự</li>
                    <li id="uppercase" class="invalid">Ít nhất 1 chữ cái in hoa</li>
                    <li id="lowercase" class="invalid">Ít nhất 1 chữ cái in thường</li>
                    <li id="number" class="invalid">Ít nhất 1 chữ số</li>
                </ul>
            </div>

            <button class="btn-register">ĐĂNG KÝ</button>
        </div>
    </div>

    <!-- HOA ANH ĐÀO -->
    <div id="sakura-container"></div>

    <!-- SCRIPT -->
    <script src="script.js"></script>

    <!-- TẠO HOA + HOVER -->
    <script>
        function createSakura() {
        const container = document.getElementById('sakura-container');
        if (!container) return;

        const leaf = document.createElement('div');
        leaf.classList.add('sakura');

        // 1. ĐỔI KÍCH THƯỚC (Cánh hoa to nhỏ ngẫu nhiên)
        const size = Math.random() * 8 + 7 + 'px'; 
        leaf.style.width = size;
        leaf.style.height = size;

        leaf.style.left = Math.random() * 100 + 'vw';

        // 2. TĂNG TỐC ĐỘ: Giảm thời gian từ (5-10s) xuống còn (2-5s) để hoa rơi nhanh hơn
        const duration = Math.random() * 3 + 2 + 's'; 
        leaf.style.animationDuration = duration;

        leaf.style.opacity = Math.random() * 0.5 + 0.5;

        container.appendChild(leaf);

        setTimeout(() => {
            leaf.remove();
        }, parseFloat(duration) * 1000);
    }

    // 3. TĂNG ĐỘ DÀY: Giảm thời gian chờ từ 200ms xuống 50ms (tạo hoa liên tục hơn)
    setInterval(createSakura, 60); 
    
        // Hover nút đăng ký → hoa xoáy
        const btn = document.querySelector(".btn-register");

        btn.addEventListener("mouseenter", () => {
            document.querySelectorAll(".sakura").forEach(petal => {
                petal.style.animation = "swirl 4s linear infinite";
            });
        });

        btn.addEventListener("mouseleave", () => {
            document.querySelectorAll(".sakura").forEach(petal => {
                petal.style.animation = "fall linear infinite";
            });
        });
    </script>

</body>
</html>
