<body class="bg-fujiCream font-inter text-gray-800">
    <div
      id="header"
      class="fixed top-0 left-0 w-full z-[9999] transition-all duration-300"
    ></div>

  <section class="max-w-7xl mx-auto px-4 mt-12 mb-8 text-center">
    <h2 class="font-playfair text-4xl text-fujiRed">Tìm chi nhánh gần bạn</h2>
    <p class="text-gray-500 mt-2">Khám phá không gian ẩm thực Nhật Bản thuần khiết</p>
  </section>

  <main class="max-w-7xl mx-auto px-4 mb-20">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

      <div class="lg:col-span-5 space-y-6 overflow-y-auto max-h-[75vh] pr-4 custom-scroll">

        <div class="group bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100">
          <div class="relative h-44 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Sushi Fuji NCT">
            <span class="status-badge absolute top-4 right-4 text-[10px] px-3 py-1.5 rounded-full font-bold uppercase tracking-wider shadow-lg"></span>
          </div>
          <div class="p-6">
            <h3 class="font-playfair text-xl text-fujiRed">Sushi Fuji Nguyễn Chí Thanh</h3>
            <p class="text-sm text-gray-500 mt-2 flex items-start">
              <span class="mr-2">📍</span> Số 12–18 Nguyễn Chí Thanh, Ba Đình, Hà Nội
            </p>
            <p class="text-sm text-gray-500 mt-1 flex items-center">
              <span class="mr-2">⏰</span> 08:00 – 22:00
            </p>
            <div class="flex gap-3 mt-6">
              <a href="tel:02473007675" class="flex-1 text-center border border-fujiRed text-fujiRed py-2.5 rounded-xl text-sm font-medium hover:bg-red-50 transition">Gọi điện</a>
              <a href="booking.html" onclick="localStorage.setItem('chon_co_so', 'nct')" class="flex-[2] text-center bg-fujiRed text-white py-2.5 rounded-xl text-sm font-medium hover:bg-red-800 transition shadow-md">Đặt bàn ngay</a>
            </div>
          </div>
        </div>

        <div class="group bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100">
          <div class="relative h-44 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Sushi Fuji Thái Hà">
            <span class="status-badge absolute top-4 right-4 text-[10px] px-3 py-1.5 rounded-full font-bold uppercase tracking-wider shadow-lg"></span>
          </div>
          <div class="p-6">
            <h3 class="font-playfair text-xl text-fujiRed">Sushi Fuji Thái Hà</h3>
            <p class="text-sm text-gray-500 mt-2 flex items-start">
              <span class="mr-2">📍</span> Lô S1, Tầng 2, Viet Tower, Thái Hà, Hà Nội
            </p>
            <p class="text-sm text-gray-500 mt-1 flex items-center">
              <span class="mr-2">⏰</span> 08:00 – 22:00
            </p>
            <div class="flex gap-3 mt-6">
              <a href="tel:02473007673" class="flex-1 text-center border border-fujiRed text-fujiRed py-2.5 rounded-xl text-sm font-medium hover:bg-red-50">Gọi</a>
              <a href="booking.html" onclick="localStorage.setItem('chon_co_so', 'thaiha')" class="flex-[2] text-center bg-fujiRed text-white py-2.5 rounded-xl text-sm font-medium hover:bg-red-800 transition shadow-md">Đặt bàn ngay</a>
            </div>
          </div>
        </div>

      </div>

      <div class="lg:col-span-7 bg-white rounded-3xl shadow-2xl overflow-hidden h-[75vh] border-4 border-white">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3724.0970344400243!2d105.808269775924!3d21.028802987777114!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab663e27129f%3A0x6b44f2d72124508!2sLotte%20Center%20Hanoi!5e0!3m2!1svi!2svn!4v1700000000000"
          class="w-full h-full border-0"
          loading="lazy"
        ></iframe>
      </div>

    </div>
  </main>

  <script>
    function updateStoreStatus() {
      const now = new Date();
      const hours = now.getHours();
      const badges = document.querySelectorAll('.status-badge');
      
      // Điều kiện: Mở từ 8h (bao gồm 8h) đến 22h (trước 22h)
      const isOpen = hours >= 8 && hours < 22;

      badges.forEach(badge => {
        if (isOpen) {
          badge.innerText = "Đang mở cửa";
          badge.className = "status-badge absolute top-4 right-4 text-[10px] px-3 py-1.5 rounded-full font-bold uppercase tracking-wider shadow-lg bg-green-500 text-white";
        } else {
          badge.innerText = "Đã đóng cửa";
          badge.className = "status-badge absolute top-4 right-4 text-[10px] px-3 py-1.5 rounded-full font-bold uppercase tracking-wider shadow-lg bg-red-600 text-white";
        }
      });
    }

    // Chạy ngay khi load trang
    updateStoreStatus();
    // Cập nhật mỗi phút một lần
    setInterval(updateStoreStatus, 60000);
  </script>
<!-- Nhúng footer -->
<div id="footer"></div>
</body>
</html>
